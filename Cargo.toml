[package]
name = "rustBobbleHeadSimulation"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustBobbleHeadSimulation"
path = "src/lib.rs"

[[bin]]
name = "rustBobbleHeadSimulation"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_gui", "qt_qml"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
cxx-qt-build = "0.7"